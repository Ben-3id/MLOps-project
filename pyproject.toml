[project]
name = "mlops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben3id", email = "ae7666000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fg-data-profiling>=4.20.0",
    "gradio>=6.31.0",
    "imbalanced-learn>=0.14.2",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "pandas>=2.2,<3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
]

[project.scripts]
mlops-project = "mlops_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
]

[tool.uv]
package = false
